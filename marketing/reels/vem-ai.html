<style>

<script>
// linha do tempo determinística: R(t) desenha o quadro do segundo t (0 a 10). Sem animação CSS, para gravar quadro a quadro.
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const p = (t, a, b) => cl((t - a) / (b - a));
  const eo = x => 1 - Math.pow(1 - x, 3);
  const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = x => { const c1 = 1.9, c3 = c1 + 1; return x <= 0 ? 0 : 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
  const lerp = (a, b, k) => a + (b - a) * k;
  function set(el, o) {
    const tf = [];
    if (o.x || o.y) tf.push('translate(' + (o.x || 0).toFixed(1) + 'px,' + (o.y || 0).toFixed(1) + 'px)');
    if (o.rx) tf.push('perspective(1600px) rotateX(' + o.rx.toFixed(2) + 'deg)');
    if (o.ry) tf.push('perspective(1600px) rotateY(' + o.ry.toFixed(2) + 'deg)');
    if (o.r) tf.push('rotate(' + o.r.toFixed(2) + 'deg)');
    if (o.s != null) tf.push('scale(' + o.s.toFixed(4) + ')');
    if (o.sx != null) tf.push('scaleX(' + o.sx.toFixed(4) + ')');
    el.style.transform = tf.join(' ');
    el.style.opacity = o.o == null ? 1 : cl(o.o).toFixed(3);
    el.style.filter = o.blur ? 'blur(' + o.blur.toFixed(1) + 'px)' + (o.br != null ? ' brightness(' + o.br.toFixed(2) + ')' : '') : o.br != null ? 'brightness(' + o.br.toFixed(2) + ')' : '';
    el.style.visibility = o.o === 0 ? 'hidden' : 'visible';
  }
  // quadra de beach em perspectiva, ao fundo
  const g = $('courtLines'), NS = 'http://www.w3.org/2000/svg';
  const line = (x1, y1, x2, y2) => { const l = document.createElementNS(NS, 'line'); Object.entries({ x1, y1, x2, y2 }).forEach(([k, v]) => l.setAttribute(k, v)); g.append(l); };
  line(330, 1180, -120, 2100); line(750, 1180, 1200, 2100); line(330, 1180, 750, 1180); line(150, 1540, 930, 1540); line(540, 1180, 540, 2100); line(-30, 1900, 1110, 1900);
  const bars = $('bars'); for (let i = 0; i < 15; i++) bars.append(document.createElement('i'));
  ['s-beach', 's-padel', 's-tenis', 's-peteca', 's-volei', 's-futevolei'].forEach(id => { const i = document.createElement('i'); i.innerHTML = '<svg class="ic"><use href="#' + id + '"/></svg>'; $('sports').append(i); });
  const LABELS = [['Marca do ', 'seu jeito'], ['Números de ', 'atleta'], ['Sua ', 'timeline'], ['Ranking da ', 'turma']];
  const T = [1.95, 3.35, 4.55, 5.75];
  let lastLabel = -1;

  window.R = function (t) {
    // fundo vivo
    set(document.querySelector('.g1'), { x: Math.sin(t * 0.9) * 90, y: Math.cos(t * 0.7) * 70 + (t > 6.7 ? 0 : 0), s: 1 + 0.08 * Math.sin(t * 1.3), o: 0.7 + 0.3 * p(t, 0, 0.4) });
    set(document.querySelector('.g2'), { x: Math.cos(t * 0.8) * 80, y: Math.sin(t * 0.6) * 90, o: 0.6 + 0.4 * p(t, 0.2, 0.8) });
    set(document.querySelector('.court'), { y: Math.sin(t * 0.8) * 14, o: 0.6 * p(t, 0, 0.5) });

    // 1 · O PLACAR QUE ESCUTA.
    const ex = eio(p(t, 1.38, 1.72));
    [['w1', 0.06, 0.42], ['w2', 0.26, 0.58], ['w3', 0.44, 0.82]].forEach(([id, a, b]) => {
      const k = back(p(t, a, b));
      set($(id), { y: (1 - k) * 180 - ex * 80, s: (0.9 + 0.1 * k) * (1 + ex * 0.4), o: p(t, a, a + 0.12) * (1 - ex), blur: ex * 14 });
    });
    set($('w3bar'), { sx: eo(p(t, 0.72, 1.02)) });
    const env = p(t, 0.55, 0.85) * (1 - ex);
    [...bars.children].forEach((b, i) => { const gs = Math.exp(-Math.pow((i - 7) / 4.2, 2)); b.style.height = (24 + 136 * gs * env * (0.45 + 0.55 * Math.abs(Math.sin(t * 9.5 + i * 0.75)))).toFixed(1) + 'px'; b.style.opacity = (0.35 + 0.65 * env).toFixed(2); });
    set($('s1'), { o: t < 1.8 ? 1 : 0 });
    const wk = eio(p(t, 1.42, 2.02));
    $('wipe1').style.top = lerp(1960, -2700, wk).toFixed(1) + 'px';

    // 2 · interface
    const pin = eo(p(t, 1.72, 2.32)), pex = eio(p(t, 6.5, 6.9));
    const on2 = t >= 1.7 && t < 6.95;
    set($('phone'), on2 ? { y: (1 - pin) * 1350 + Math.sin(t * 1.7) * 10 - pex * 60, rx: (1 - pin) * 30, r: Math.sin(t * 1.1) * 1.1, s: (0.9 + 0.1 * pin) * (1 + pex * 0.8), o: (1 - pex), blur: pex * 18 } : { o: 0 });
    const sk = eo(p(t, 2.02, 2.62));
    set($('sideL'), on2 ? { x: -(1 - sk) * 520 - pex * 300, y: Math.sin(t * 1.4 + 1) * 14, r: -9, s: 0.82, o: 0.42 * sk * (1 - pex), br: 0.75 } : { o: 0 });
    set($('sideR'), on2 ? { x: (1 - sk) * 520 + pex * 300, y: Math.cos(t * 1.3) * 14, r: 9, s: 0.82, o: 0.42 * sk * (1 - pex), br: 0.75 } : { o: 0 });
    for (let i = 0; i < 4; i++) {
      const ki = i === 0 ? 1 : eio(p(t, T[i], T[i] + 0.42)), kn = i < 3 ? eio(p(t, T[i + 1], T[i + 1] + 0.42)) : 0;
      set($('scr' + i), { y: (1 - ki) * 1310 - kn * 320, s: 1 - kn * 0.06, br: 1 - kn * 0.55, o: ki > 0 ? 1 : 0 });
    }
    // rótulo de cada tela
    let li = -1; for (let i = 0; i < 4; i++) if (t >= T[i]) li = i;
    if (li !== lastLabel && li >= 0) { $('labelT').innerHTML = LABELS[li][0] + '<em>' + LABELS[li][1] + '</em>'; lastLabel = li; }
    if (li >= 0 && on2) { const a = T[li], k = eo(p(t, a + 0.05, a + 0.38)), out = li < 3 ? p(t, T[li + 1] - 0.16, T[li + 1] + 0.02) : pex; set($('label'), { y: (1 - k) * 60 - out * 40, o: k * (1 - out), blur: out * 6 }); } else set($('label'), { o: 0 });
    // placar: ouve "ponto verde", 30 vira 40
    const heardOn = t >= 2.55;
    $('heard').textContent = heardOn ? '“ponto verde”' : '…';
    set($('mic'), { s: t > 2.2 && t < 3.1 ? 1 + 0.09 * Math.abs(Math.sin(t * 11)) : 1 });
    const bk = back(p(t, 2.32, 2.6)), bo = p(t, 3.15, 3.32);
    set($('bubble'), on2 ? { s: bk * (1 - bo * 0.4), o: p(t, 2.32, 2.42) * (1 - bo), r: (1 - bk) * -8 } : { o: 0 });
    [['ring1', 2.34], ['ring2', 2.56]].forEach(([id, a]) => { const k = p(t, a, a + 0.65); set($(id), { s: 0.5 + k * 3.2, o: k > 0 && k < 1 ? (1 - k) * 0.9 : 0 }); });
    const fk = eio(p(t, 2.74, 2.96));
    set($('n0a'), { y: -fk * 300, o: 1 - fk, blur: fk * 6 });
    set($('n0b'), { y: (1 - fk) * 300, o: fk });
    set($('team0'), { br: 1 + 0.35 * Math.sin(Math.PI * p(t, 2.74, 3.15)) });
    set($('ok'), { s: back(p(t, 2.78, 3.02)), o: p(t, 2.78, 2.86) });
    const pk = p(t, 2.8, 3.35);
    set($('plus'), { y: -pk * 130, s: 0.7 + back(p(t, 2.8, 3.0)) * 0.3, o: pk > 0 ? Math.min(1, pk * 6) * (1 - p(t, 3.1, 3.35)) : 0 });
    set($('bp'), { s: 0.8 + 0.2 * back(p(t, 2.98, 3.2)), o: p(t, 2.98, 3.08) });

    // 3 · VEM AÍ…
    const lin = eio(p(t, 6.62, 6.98)), lout = eio(p(t, 8.42, 8.78));
    const lb = $('limebg');
    lb.style.clipPath = 'circle(' + (lin * 1500).toFixed(0) + 'px at 50% 52%)';
    set(lb, { y: -lout * 2500, r: lout * -6, o: t > 6.6 && t < 8.85 ? 1 : 0 });
    const on3 = t > 6.85 && t < 8.85;
    set($('s3'), on3 ? { y: -lout * 2300, s: 1 + 0.05 * p(t, 7.3, 8.4) } : { o: 0 });
    [['v1', 6.92, 7.2], ['v2', 7.08, 7.36]].forEach(([id, a, b]) => { const k = back(p(t, a, b)); set($(id), { s: 2.2 - 1.2 * k, o: p(t, a, a + 0.08), blur: (1 - p(t, a, b)) * 10 }); });
    ['d1', 'd2', 'd3'].forEach((id, i) => { const a = 7.42 + i * 0.17, k = p(t, a, a + 0.28); set($(id), { y: -70 * Math.sin(Math.PI * k), o: k > 0 ? 1 : 0 }); });
    const sk3 = eo(p(t, 7.82, 8.12)); set($('s3sub'), { y: (1 - sk3) * 40, o: sk3 });

    // 4 · marca
    const on4 = t > 8.5;
    set($('s4'), { o: on4 ? 1 : 0 });
    const lk = back(p(t, 8.62, 8.98));
    set($('logo'), { s: 0.55 + 0.45 * lk, o: p(t, 8.62, 8.72), blur: (1 - p(t, 8.62, 8.9)) * 10 });
    const tk = eo(p(t, 8.84, 9.12)); set($('tag'), { y: (1 - tk) * 40, o: tk });
    [...$('sports').children].forEach((el, i) => { const a = 8.94 + i * 0.06, k = back(p(t, a, a + 0.26)); set(el, { y: (1 - k) * 50, s: 0.6 + 0.4 * k, o: p(t, a, a + 0.08) }); });
    const ok4 = back(p(t, 9.28, 9.52)); set($('soon'), { s: (0.7 + 0.3 * ok4) * (1 + 0.035 * Math.sin(Math.max(0, t - 9.5) * 8)), o: p(t, 9.28, 9.36) });
  };
  window.R(0);
})();

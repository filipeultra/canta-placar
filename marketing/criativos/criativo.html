<style>
@font-face { font-family: "Archivo Condensed"; src: url("../../fonts/archivo-condensed-latin.woff2") format("woff2"); font-weight: 600 900; }
@font-face { font-family: "Bricolage Grotesque"; src: url("../../fonts/bricolage-grotesque-latin.woff2") format("woff2"); font-weight: 400 800; }
:root { --bg: #060708; --lime: #AFFB48; --orange: #FF5A1F; --ink: #101500; --fg: #F4F6F2; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; background: var(--bg); overflow: hidden; }
body { font-family: "Bricolage Grotesque", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
.layer { position: absolute; inset: 0; }
#bg { overflow: hidden; }
#bgimg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; transform-origin: 50% 50%; will-change: transform, filter; }
#shade { background: linear-gradient(180deg, rgba(6,7,8,.55) 0%, rgba(6,7,8,0) 22%, rgba(6,7,8,0) 60%, rgba(6,7,8,.7) 100%); }
#dim { background: #060708; opacity: 0; }
/* celular com a tela real do app */
#phone { position: absolute; left: 50%; top: 520px; width: 580px; height: 1230px; margin-left: -290px; border-radius: 78px; background: #0b0c0d; padding: 15px;
  box-shadow: 0 0 0 4px #2a2d30, 0 40px 120px rgba(0,0,0,.65), 0 0 90px rgba(175,251,72,.18); will-change: transform; }
#screen { width: 550px; height: 1200px; border-radius: 64px; overflow: hidden; position: relative; background: #000; }
#scr { width: 550px; height: 1190px; display: block; transform-origin: 50% 0; }
#island { position: absolute; left: 50%; top: 14px; width: 150px; height: 42px; margin-left: -75px; border-radius: 22px; background: #000; z-index: 2; }
/* stickers e balões */
.stk { position: absolute; will-change: transform; filter: drop-shadow(0 14px 22px rgba(0,0,0,.45)); transform-origin: 50% 70%; }
.bub { position: absolute; padding: 18px 40px 22px; border-radius: 60px; background: #fff; border: 8px solid #0b0c0d; font: 900 120px/0.95 "Archivo Condensed", sans-serif;
  text-transform: uppercase; color: #0b0c0d; white-space: nowrap; will-change: transform; box-shadow: 10px 12px 0 #0b0c0d; }
.bub::after { content: ""; position: absolute; bottom: -46px; width: 0; height: 0; border-style: solid; }
.bub.tl::after { left: 52px; border-width: 46px 12px 0 46px; border-color: #0b0c0d transparent transparent transparent; }
.bub.tr::after { right: 52px; border-width: 46px 46px 0 12px; border-color: #0b0c0d transparent transparent transparent; }
.bub.lime { background: var(--lime); } .bub.orange { background: var(--orange); color: #fff; }
.pill { position: absolute; padding: 14px 34px 18px; border-radius: 26px; font: 900 96px/1 "Archivo Condensed", sans-serif; text-transform: uppercase; letter-spacing: .01em;
  border: 7px solid #0b0c0d; box-shadow: 9px 10px 0 #0b0c0d; white-space: nowrap; will-change: transform; }
.pill.lime { background: var(--lime); color: var(--ink); } .pill.orange { background: var(--orange); color: #fff; } .pill.white { background: #fff; color: #0b0c0d; }
/* legenda palavra por palavra */
#cap { position: absolute; left: 60px; right: 60px; top: 1040px; text-align: center; }
#cap.top { top: 290px; }
#cap .ln { display: inline-block; font: 900 104px/1.02 "Archivo Condensed", sans-serif; text-transform: uppercase; letter-spacing: .005em; color: #fff;
  -webkit-text-stroke: 14px #060708; paint-order: stroke fill; text-shadow: 0 10px 30px rgba(0,0,0,.6); will-change: transform; }
#cap .w { display: inline-block; margin: 0 .12em; }
#cap .w.on { color: var(--lime); }
#cap .w.off { opacity: 0; }
/* carimbo e cartões */
.stamp { position: absolute; left: 50%; top: 760px; width: 900px; margin-left: -450px; padding: 26px 0 34px; text-align: center; border: 14px solid var(--lime); border-radius: 28px;
  font: 900 150px/0.9 "Archivo Condensed", sans-serif; text-transform: uppercase; color: var(--lime); background: rgba(6,7,8,.82); will-change: transform; }
.card { position: absolute; left: 70px; right: 70px; top: 300px; height: 940px; border-radius: 60px; background: #0d0f10; border: 6px solid rgba(175,251,72,.5);
  box-shadow: 0 30px 120px rgba(0,0,0,.6), 0 0 120px rgba(175,251,72,.16); text-align: center; padding-top: 420px; will-change: transform; }
.card h3 { font: 900 128px/0.92 "Archivo Condensed", sans-serif; text-transform: uppercase; color: var(--lime); }
.card .price { font: 800 74px/1.1 "Bricolage Grotesque", sans-serif; margin-top: 26px; color: #fff; }
.card .price small { font-size: 46px; color: #A3A9A6; font-weight: 600; }
.card .lim { display: inline-block; margin-top: 34px; padding: 14px 30px; border-radius: 18px; background: var(--orange); color: #fff; font: 900 58px/1 "Archivo Condensed", sans-serif; text-transform: uppercase; }
/* tela final */
#end { background: var(--lime); color: var(--ink); text-align: center; opacity: 0; }
#end .logo { position: absolute; left: 50%; top: 300px; width: 640px; height: 162px; margin-left: -320px; color: var(--ink); }
#end h2 { position: absolute; left: 50px; right: 50px; top: 560px; font: 900 168px/0.88 "Archivo Condensed", sans-serif; text-transform: uppercase; letter-spacing: -.005em; }
#end .sub { position: absolute; left: 90px; right: 90px; top: 1040px; font: 700 50px/1.2 "Bricolage Grotesque", sans-serif; }
#end .badge { position: absolute; left: 50%; top: 940px; transform: translateX(-50%); padding: 12px 30px; border-radius: 16px; background: var(--ink); color: var(--lime); font: 900 54px/1 "Archivo Condensed", sans-serif; text-transform: uppercase; white-space: nowrap; }
#end .btn { position: absolute; left: 50%; top: 1200px; width: 760px; height: 160px; margin-left: -380px; border-radius: 80px; background: var(--ink); color: #fff;
  font: 900 92px/160px "Archivo Condensed", sans-serif; text-transform: uppercase; box-shadow: 0 18px 0 rgba(16,21,0,.25); will-change: transform; }
#end .btn b { color: var(--lime); }
#end .sports { position: absolute; left: 0; right: 0; top: 1400px; font: 600 36px/1.3 "Bricolage Grotesque", sans-serif; opacity: .75; }
#flash { background: #fff; opacity: 0; }
.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>

 8.22258V9.7268C170.154 11.5796 168.962 12.7903 167.109 12.7903H166.008V18H164.064ZM166.008 10.9559H167.017C167.769 10.9559 168.21 10.5156 168.21 9.76349V8.18589C168.21 7.43378 167.769 6.99353 167.017 6.99353H166.008V10.9559ZM171.418 18V5.15911H173.363V16.1656H176.83V18H171.418ZM171.625 33L171.203 30.1567H169.112L168.69 33H166.746L168.874 20.1591H171.479L173.606 33H171.625ZM169.369 28.2856H170.947L170.158 22.9107L169.369 28.2856ZM178.374 20.1591H180.41L177.806 27.6252V33H175.861V27.6252L173.256 20.1591H175.329L176.833 25.057L178.374 20.1591Z"/></symbol>

<script>
// ---------- utilitários ----------
const $ = id => document.getElementById(id);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const p = (t, a, b) => clamp((t - a) / (b - a));                  // progresso de a até b
const eo = x => 1 - Math.pow(1 - x, 3);                             // ease-out
const eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const back = x => { const c = 1.9; return x <= 0 ? 0 : x >= 1 ? 1 : 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const lerp = (a, b, x) => a + (b - a) * x;
const pad = n => String(n).padStart(4, '0');
const C = new URLSearchParams(location.search).get('c') || 'a';
const F = window.FALAS[C], K = F.K;
const T = x => x / K;                                               // tempo da fala original -> tempo do vídeo

// ---------- roteiro de cada criativo (tempos na fala original; T() converte) ----------
// bg: imagem parada (img) com zoom (kb: [escala inicial, final, x0, x1, y0, y1] em px) ou clipe (seq + início + velocidade)
// phone: tela do app (seq, início no clipe em s, zoom do topo)
const S = {
  a: {
    dur: 19.0,
    scenes: [
      { t0: 0, t1: 3.3, seq: 'work/clips/a', from: 1.2, speed: 0.95, n: 150, kb: [1.04, 1.1, 0, 0, 0, 30] },
      { t0: 3.3, t1: 4.68, img: 'src/img/a1-briga.png', kb: [1.12, 1.12, 0, 0, 30, 30], gray: 1, shake: 1 },
      { t0: 4.68, t1: 7.45, img: 'src/img/a1-briga.png', kb: [1.16, 1.0, 0, 0, 20, -10], shake: .35 },
      { t0: 7.45, t1: 15.2, img: 'src/img/a1-briga.png', kb: [1.25, 1.35, 0, 0, 0, 0], blur: 26, dim: .55 }
    ],
    phone: [ { t0: 7.45, t1: 11.6, seq: 'work/app/placar', from: 0.35, n: 240 }, { t0: 11.6, t1: 15.2, seq: 'work/app/momento', from: 1.0, n: 180 } ],
    fx: [
      { k: 'bub', t0: 0.36, t1: 3.3, text: '5-4!', cls: 'lime tl', x: 80, y: 360, rot: -8 },
      { k: 'bub', t0: 2.2, t1: 3.3, text: '4-5!', cls: 'orange tr', x: 560, y: 520, rot: 7 },
      { k: 'stk', t0: 3.3, t1: 4.75, src: 'src/img/a2-confuso.png', x: 190, y: 560, w: 700, rot: -4 },
      { k: 'stk', t0: 12.85, t1: 15.2, src: 'src/img/bola.png', x: 800, y: 470, w: 250, rot: 12 }
    ],
    chunks: [[0, 3], [4, 7], [8, 10], [11, 13], [14, 17], [18, 19], [20, 24], [25, 27], [28, 29], [30, 31]],
    endAt: 15.2, end: { h: 'Jogue no<br>modo Ultra.', badge: 'Grátis · sem cartão', sub: 'Placar fácil e cada ponto registrado,<br>com horário.', btn: 'Baixe <b>grátis</b> →' }
  },
  b: {
    dur: 21.8,
    scenes: [
      { t0: 0, t1: 4.1, seq: 'work/clips/b', from: 0, speed: 0.8, n: 150, kb: [1.05, 1.12, 0, 0, 0, 20] },
      { t0: 4.1, t1: 7.5, img: 'src/img/b2-memoria.png', kb: [1.0, 1.28, 0, 0, 0, 180], fade: [5.6, 7.4] },
      { t0: 7.5, t1: 17.5, img: 'src/img/b1-smash.png', kb: [1.3, 1.4, 0, 0, 0, 0], blur: 26, dim: .55 }
    ],
    phone: [ { t0: 7.5, t1: 15.7, seq: 'work/app/stats', from: 0.5, n: 180, hold: 5.9 }, { t0: 15.7, t1: 17.5, seq: 'work/app/conquista', from: 0.7, n: 135 } ],
    fx: [
      { k: 'pill', t0: 3.08, t1: 4.1, text: 'Aces: ??', cls: 'white', x: 300, y: 330, rot: -5, spin: 1 },
      { k: 'pill', t0: 11.56, t1: 14.0, text: 'Aces', cls: 'lime', x: 40, y: 560, rot: -7 },
      { k: 'pill', t0: 12.39, t1: 14.0, text: 'Winners', cls: 'white', x: 560, y: 760, rot: 6 },
      { k: 'pill', t0: 13.23, t1: 14.0, text: 'Erros', cls: 'orange', x: 90, y: 960, rot: -4 },
      { k: 'stk', t0: 16.6, t1: 17.5, src: 'src/img/b3-trofeu.png', x: 620, y: 170, w: 420, rot: 10 }
    ],
    chunks: [[0, 3], [4, 9], [10, 13], [14, 18], [19, 21], [22, 24], [25, 27], [31, 36], [37, 40]],
    endAt: 17.5, end: { size: 132, h: 'Seus números<br>de atleta.', badge: 'Pro 14 dias grátis · sem cartão', sub: 'Aces, winners, erros e a sua evolução,<br>partida a partida.', btn: 'Baixe <b>grátis</b> →' }
  },
  c: {
    dur: 17.4,
    scenes: [
      { t0: 0, t1: 1.85, seq: 'work/clips/c', from: 0, speed: 0.9, n: 150, kb: [1.03, 1.08, 0, 0, 0, 10] },
      { t0: 1.85, t1: 4.3, img: 'src/img/c1-turma.png', kb: [1.08, 1.2, 0, 0, 0, 40] },
      { t0: 4.3, t1: 6.2, img: 'src/img/c2-podio.png', kb: [1.0, 1.14, 0, 0, 0, 60] },
      { t0: 6.2, t1: 10.0, img: 'src/img/c2-podio.png', kb: [1.25, 1.35, 0, 0, 0, 0], blur: 26, dim: .55 },
      { t0: 10.0, t1: 13.95, img: 'src/img/c2-podio.png', kb: [1.35, 1.45, 0, 0, 0, 0], blur: 30, dim: .7 }
    ],
    phone: [ { t0: 6.2, t1: 7.3, seq: 'work/app/grupo', from: 2.6, n: 150 }, { t0: 7.3, t1: 8.45, seq: 'work/app/replay', from: 1.6, n: 210 }, { t0: 8.45, t1: 10.0, seq: 'work/app/feed', from: 1.2, n: 120 } ],
    fx: [
      { k: 'bub', t0: 0.25, t1: 1.85, text: 'Eu!', cls: 'lime tl', x: 40, y: 330, rot: -9, s: .62 },
      { k: 'bub', t0: 0.55, t1: 1.85, text: 'Eu!', cls: 'orange tl', x: 290, y: 250, rot: 6, s: .62 },
      { k: 'bub', t0: 0.85, t1: 1.85, text: 'Eu!', cls: 'lime tr', x: 560, y: 320, rot: -5, s: .62 },
      { k: 'bub', t0: 1.15, t1: 1.85, text: 'Eu!', cls: 'orange tr', x: 790, y: 410, rot: 8, s: .62 },
      { k: 'stamp', t0: 5.29, t1: 6.2, text: 'Agora<br>tem prova' },
      { k: 'card', t0: 10.0, t1: 13.95, html: '<h3>Preço de<br>Fundador</h3><div class="price">R$ 119,90<small>/ano · travado</small></div><div class="lim">Só para os 1.000 primeiros</div>' },
      { k: 'stk', t0: 10.25, t1: 13.95, src: 'src/img/c3-medalha.png', x: 330, y: 330, w: 420, rot: -6 }
    ],
    chunks: [[0, 3], [4, 6], [7, 12], [16, 18], [19, 21], [22, 26]],
    endAt: 13.95, end: { h: 'Chama a<br>turma.', badge: 'Grátis para começar', sub: 'Ranking do mês, replay dos lances<br>e a resenha do grupo.', btn: 'Baixe <b>grátis</b> →' }
  }
}[C];

// ---------- montagem dos elementos fixos ----------
const TEST = new URLSearchParams(location.search).has('teste');   // marcadores no lugar dos arquivos do Magnific, só para conferir o layout
const fxEls = S.fx.map(f => {
  let e;
  if (f.k === 'stk') { e = document.createElement('img'); e.className = 'stk'; e.src = TEST ? f.src.replace('src/img/', 'work/marcador/') : f.src; e.style.width = f.w + 'px'; }
  else { e = document.createElement('div'); e.className = f.k === 'bub' ? 'bub ' + f.cls : f.k === 'pill' ? 'pill ' + f.cls : f.k; e.innerHTML = f.html || f.text; }
  if (f.x != null) { e.style.left = f.x + 'px'; e.style.top = f.y + 'px'; }
  e.style.opacity = 0; $('fx').appendChild(e); return e;
});
$('endH').innerHTML = S.end.h; if (S.end.size) $('endH').style.fontSize = S.end.size + 'px'; $('endBadge').textContent = S.end.badge; $('endSub').innerHTML = S.end.sub; $('endBtn').innerHTML = S.end.btn;
const W = F.words.map(w => ({ txt: w[0], a: T(w[1]), b: T(w[2]) }));
const CH = S.chunks.map(([i, j]) => ({ i, j, a: W[i].a, words: W.slice(i, j + 1) }));
CH.forEach((c, k) => { c.b = k + 1 < CH.length ? Math.min(CH[k + 1].a, c.words[c.words.length - 1].b + 0.45) : c.words[c.words.length - 1].b + 0.45; });

const loadImg = (el, src) => { if (TEST) src = src.replace('src/img/', 'work/marcador/').replace(/work\/clips\/[abc]\/f\d+\.jpg/, 'work/marcador/clipe.png'); if (el.dataset.src === src) return Promise.resolve(); el.dataset.src = src; el.src = src; return el.decode().catch(() => {}); };
const seqSrc = (sq, local, n) => sq + '/f' + pad(clamp(Math.round(local * 30), 0, n - 1)) + '.jpg';

// ---------- um quadro ----------
window.R = async function (t) {
  const jobs = [];
  // fundo
  const sc = S.scenes.find(s => t >= T(s.t0) && t < T(s.t1)) || S.scenes[S.scenes.length - 1];
  const a0 = T(sc.t0), a1 = T(sc.t1), x = eio(p(t, a0, a1)), bg = $('bgimg');
  jobs.push(loadImg(bg, sc.seq ? seqSrc(sc.seq, sc.from + (t - a0) * sc.speed, sc.n) : sc.img));
  const [s0, s1, x0, x1, y0, y1] = sc.kb; let sh = 0, shy = 0;
  if (sc.shake) { const k = sc.shake * Math.max(0, 1 - (t - a0) * 2.2); sh = Math.sin(t * 90) * 22 * k; shy = Math.cos(t * 77) * 14 * k; }
  bg.style.transform = `translate(${lerp(x0, x1, x) + sh}px, ${lerp(y0, y1, x) + shy}px) scale(${lerp(s0, s1, x)})`;
  let filt = '';
  if (sc.blur) filt += `blur(${sc.blur}px) `;
  if (sc.gray) filt += 'grayscale(1) contrast(1.1) ';
  if (sc.fade) { const f = p(t, T(sc.fade[0]), T(sc.fade[1])); filt += `blur(${f * 14}px) grayscale(${f}) brightness(${1 - f * .35}) `; }
  bg.style.filter = filt || 'none';
  $('dim').style.opacity = sc.dim || 0;
  // celular
  const ph = S.phone.find(q => t >= T(q.t0) - 0.001 && t < T(q.t1));
  const phEl = $('phone');
  if (ph) {
    const first = S.phone[0], last = S.phone[S.phone.length - 1];
    const enter = back(p(t, T(first.t0), T(first.t0) + 0.5)), leave = eo(p(t, T(last.t1) - 0.3, T(last.t1)));
    const swap = S.phone.indexOf(ph) > 0 ? back(p(t, T(ph.t0), T(ph.t0) + 0.35)) : 1;
    phEl.style.opacity = 1;
    phEl.style.transform = `translateY(${(1 - enter) * 1500 + leave * 1500}px) rotate(${lerp(-9, -2.5, enter) + Math.sin(t * 1.3) * .6}deg) scale(${(0.94 + 0.06 * swap) * (1 + 0.012 * Math.sin(t * 2))})`;
    let local = ph.from + (t - T(ph.t0)); if (ph.hold) local = Math.min(local, ph.hold);
    jobs.push(loadImg($('scr'), seqSrc(ph.seq, local, ph.n)));
  } else phEl.style.opacity = 0;
  $('cap').classList.toggle('top', !!ph);
  // stickers, balões, carimbo e cartões
  S.fx.forEach((f, k) => {
    const e = fxEls[k], a = T(f.t0), b = T(f.t1);
    if (t < a || t >= b) { e.style.opacity = 0; return; }
    const pin = back(p(t, a, a + 0.32)), out = p(t, b - 0.12, b), base = f.s || 1;
    e.style.opacity = 1 - out;
    if (f.k === 'stamp') { const z = p(t, a, a + 0.18); e.style.transform = `rotate(-6deg) scale(${lerp(2.4, 1, eo(z))})`; e.style.opacity = z * (1 - out); return; }
    if (f.k === 'card') { e.style.transform = `translateY(${(1 - back(p(t, a, a + 0.45))) * 1300}px)`; return; }
    const wob = Math.sin((t - a) * 7 + k) * 2.4;
    e.style.transform = `rotate(${(f.rot || 0) + wob}deg) scale(${base * pin * (1 - out * .4)})`;
    if (f.spin) e.textContent = 'Aces: ' + (t - a < 0.6 ? String(Math.floor((t * 37) % 99)).padStart(2, '0') : '??');
  });
  // legenda
  const ch = CH.find(c => t >= c.a - 0.04 && t < c.b);
  const cap = $('cap');
  if (ch && t < T(S.endAt)) {
    const key = ch.i + '-' + ch.j;
    if (cap.dataset.k !== key) { cap.dataset.k = key; cap.innerHTML = '<span class="ln">' + ch.words.map(w => '<span class="w">' + w.txt.replace(/\.\.\.$/, '…') + '</span>').join(' ') + '</span>'; }
    const ln = cap.firstChild, z = back(p(t, ch.a - 0.04, ch.a + 0.16));
    ln.style.transform = `scale(${0.82 + 0.18 * z}) rotate(${Math.sin(ch.i) * 1.6}deg)`;
    [...ln.children].forEach((el, i) => { const w = ch.words[i]; el.className = 'w' + (t >= w.a - 0.03 && t < (ch.words[i + 1] ? ch.words[i + 1].a : ch.b) ? ' on' : ''); });
    cap.style.opacity = 1;
  } else cap.style.opacity = 0;
  // tela final
  const ea = T(S.endAt), e = $('end');
  const ein = p(t, ea, ea + 0.28);
  e.style.opacity = ein;
  e.style.clipPath = `circle(${eo(ein) * 130}% at 50% 62%)`;
  $('endH').style.transform = `translateY(${(1 - back(p(t, ea + 0.1, ea + 0.55))) * 120}px)`;
  $('endBtn').style.transform = `scale(${back(p(t, ea + 0.35, ea + 0.75)) * (1 + 0.04 * Math.max(0, Math.sin((t - ea) * 6)))})`;
  e.querySelector('.logo').style.transform = `scale(${0.8 + 0.2 * back(p(t, ea, ea + 0.4))})`;
  // flash nas trocas de cena
  let fl = 0; S.scenes.forEach(s => { const a = T(s.t0); if (s.t0 > 0 && t >= a && t < a + 0.12) fl = Math.max(fl, 1 - p(t, a, a + 0.12)); });
  $('flash').style.opacity = fl * .35;
  await Promise.all(jobs);
};
window.DUR = T(S.dur);
</script>
